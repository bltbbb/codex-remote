name: 验证 iOS Swift

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - "packages/protocol/**"
      - "packages/protocol-mock/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-swift.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/protocol/**"
      - "packages/protocol-mock/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-swift.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 显示工具链
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | sed -n '1,120p'

      - name: 准备协议模拟器
        shell: bash
        run: |
          set -eo pipefail
          node --version
          npm --version
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile

      - name: 启动协议模拟器
        shell: bash
        run: |
          set -eo pipefail
          REMOTE_CODEX_MOCK_HOST=127.0.0.1 \
          REMOTE_CODEX_MOCK_PORT=18787 \
          REMOTE_CODEX_MOCK_STEP_MS=10 \
          pnpm exec tsx packages/protocol-mock/src/server.ts \
            > "$RUNNER_TEMP/protocol-mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/protocol-mock.pid"
          for _ in {1..30}; do
            if lsof -nP -iTCP:18787 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "协议模拟器已监听 127.0.0.1:18787"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/protocol-mock.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/protocol-mock.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/protocol-mock.log"
          echo "::error::协议模拟器启动超时"
          exit 1

      - name: 列出 Swift Package schemes
        shell: bash
        working-directory: apps/ios
        run: xcodebuild -list

      - name: 编译 iOS App
        shell: bash
        working-directory: apps/ios
        run: |
          set -eo pipefail
          xcodebuild build \
            -scheme RemoteCodexApp \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../../artifacts/xcode-derived-data \
            CODE_SIGNING_ALLOWED=NO

      - name: 编译 iOS XCTest
        shell: bash
        working-directory: apps/ios
        run: |
          set -eo pipefail
          xcodebuild build-for-testing \
            -scheme RemoteCodex-Package \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../../artifacts/xcode-derived-data \
            CODE_SIGNING_ALLOWED=NO

      - name: 运行 iOS XCTest
        shell: bash
        working-directory: apps/ios
        run: |
          set -eo pipefail
          device="$(
            xcrun simctl list devices available |
            awk -F '[()]' '/iPhone/ && /Shutdown/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit }'
          )"
          if [ -z "$device" ]; then
            echo "::error::没有找到可用的 iPhone 模拟器"
            exit 1
          fi
          echo "使用模拟器：$device"
          export REMOTE_CODEX_E2E=1
          export REMOTE_CODEX_E2E_URL=ws://127.0.0.1:18787/ws
          xcodebuild test \
            -scheme RemoteCodex-Package \
            -destination "platform=iOS Simulator,name=$device,OS=latest" \
            -derivedDataPath ../../artifacts/xcode-derived-data \
            CODE_SIGNING_ALLOWED=NO

      - name: 构建无签名 iOS IPA
        shell: bash
        working-directory: apps/ios
        run: |
          set -eo pipefail
          xcodebuild build \
            -scheme RemoteCodexApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../../artifacts/xcode-device-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          app_path="../../artifacts/xcode-device-derived-data/Build/Products/Release-iphoneos/RemoteCodexApp.app"
          test -d "$app_path"
          executable="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$app_path/Info.plist"
          )"
          bundle_id="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$app_path/Info.plist"
          )"
          test -n "$executable"
          test -n "$bundle_id"
          echo "Bundle ID：$bundle_id"
          echo "可执行文件：$executable"
          xcrun lipo -info "$app_path/$executable"

          staging="../../artifacts/unsigned-ipa"
          rm -rf "$staging"
          mkdir -p "$staging/Payload"
          cp -R "$app_path" "$staging/Payload/"
          (
            cd "$staging"
            zip -qry RemoteCodexApp.ipa Payload
            shasum -a 256 RemoteCodexApp.ipa > RemoteCodexApp.ipa.sha256
          )

      - name: 上传无签名 IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RemoteCodexApp-unsigned-ipa
          path: |
            artifacts/unsigned-ipa/RemoteCodexApp.ipa
            artifacts/unsigned-ipa/RemoteCodexApp.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 停止协议模拟器
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/protocol-mock.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/protocol-mock.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/protocol-mock.log" ]; then
            echo "协议模拟器日志："
            cat "$RUNNER_TEMP/protocol-mock.log"
          fi
